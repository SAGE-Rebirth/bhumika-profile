<!DOCTYPE html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#325346">
<title>Page not found | Yatharth</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<!--FONTS-->
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f4faff; color: #111d23; font: 400 16px/1.6 "Plus Jakarta Sans", system-ui, sans-serif; }
  main { max-width: 480px; text-align: center; }
  .code { font: 600 14px/1 "Plus Jakarta Sans", system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #8e4d2a; }
  h1 { font: 500 clamp(32px, 6vw, 44px)/1.15 Newsreader, Georgia, serif; letter-spacing: -.015em; margin: 12px 0 8px; }
  p { color: #414844; margin: 0 0 28px; }
  .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  a { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 22px; border-radius: 12px; font-weight: 600; text-decoration: none; }
  .primary { background: #325346; color: #fff; }
  .secondary { background: #e3f0f8; color: #325346; }
  a:focus-visible { outline: 2px solid #325346; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <div class="code">404 · Page not found</div>
  <h1>This page has wandered off.</h1>
  <p>The page you're looking for doesn't exist or has moved. Everything about Yatharth is on the home page.</p>
  <div class="actions">
    <a class="primary" href="/">Back to home</a>
    <a class="secondary" href="/#direct-contact">Get in touch</a>
  </div>
</main>
</body>
</html>
